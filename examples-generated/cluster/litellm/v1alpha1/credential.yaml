apiVersion: litellm.crossplane.io/v1alpha1
kind: Credential
metadata:
  annotations:
    meta.upbound.io/example-id: litellm/v1alpha1/credential
  labels:
    testing.upbound.io/example-name: full
  name: full
spec:
  forProvider:
    credentialInfo:
      provider: azure
    credentialInfoJson: |-
      ${jsonencode({
          provider    = "azure" # Equal overlap is allowed.
          enabled     = true
          retry_count = 3
          labels      = ["production", "priority"]
        })}
    credentialValuesJsonSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
