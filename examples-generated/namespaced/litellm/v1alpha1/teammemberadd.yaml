apiVersion: litellm.m.crossplane.io/v1alpha1
kind: TeamMemberAdd
metadata:
  annotations:
    meta.upbound.io/example-id: litellm/v1alpha1/teammemberadd
  labels:
    testing.upbound.io/example-name: developers
  name: developers
  namespace: crossplane-system
spec:
  forProvider:
    member:
    - role: user
      userEmail: developer@example.com
    teamIdSelector:
      matchLabels:
        testing.upbound.io/example-name: engineering

---

apiVersion: litellm.m.crossplane.io/v1alpha1
kind: Team
metadata:
  annotations:
    meta.upbound.io/example-id: /v1alpha1/teammemberadd
  labels:
    testing.upbound.io/example-name: engineering
  name: engineering
  namespace: crossplane-system
spec:
  forProvider:
    teamAlias: engineering
