apiVersion: litellm.m.crossplane.io/v1alpha1
kind: OrganizationMember
metadata:
  annotations:
    meta.upbound.io/example-id: litellm/v1alpha1/organizationmember
  labels:
    testing.upbound.io/example-name: admin
  name: admin
  namespace: crossplane-system
spec:
  forProvider:
    maxBudgetInOrganization: 500
    organizationIdSelector:
      matchLabels:
        testing.upbound.io/example-name: company
    role: org_admin
    userIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: litellm.m.crossplane.io/v1alpha1
kind: Organization
metadata:
  annotations:
    meta.upbound.io/example-id: /v1alpha1/organizationmember
  labels:
    testing.upbound.io/example-name: company
  name: company
  namespace: crossplane-system
spec:
  forProvider:
    organizationAlias: my-company
