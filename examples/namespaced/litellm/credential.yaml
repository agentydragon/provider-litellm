apiVersion: litellm.m.crossplane.io/v1alpha1
kind: Credential
metadata:
  annotations:
    meta.upbound.io/example-id: litellm/v1alpha1/credential
  labels:
    testing.upbound.io/example-name: example
  name: example-credential
  namespace: crossplane-system
spec:
  # credential_name carries the external name, so this creates the LiteLLM
  # credential "example-credential".
  forProvider:
    credentialInfo:
      description: Upstream LLM credential managed by Crossplane
    # credentialValues is a map, so every key of this Secret becomes one
    # credential value. LiteLLM never reads these back, which makes the Secret
    # the only source of truth. See cluster/test/setup.sh for the e2e fixture.
    credentialValuesSecretRef:
      name: model-credentials
