apiVersion: litellm.m.crossplane.io/v1alpha1
kind: MCPServer
metadata:
  annotations:
    meta.upbound.io/example-id: litellm/v1alpha1/mcpserver
  labels:
    testing.upbound.io/example-name: example
  name: example-mcp-server
  namespace: crossplane-system
spec:
  forProvider:
    # LiteLLM requires underscores rather than hyphens in MCP server names.
    serverName: crossplane_example
    description: Example MCP server managed by Crossplane
    transport: http
    # v2.1.0 marks the MCP server URL sensitive, so it is read from a Secret.
    urlSecretRef:
      name: mcp-server-url
      key: url
