apiVersion: litellm.crossplane.io/v1alpha1
kind: Key
metadata:
  annotations:
    meta.upbound.io/example-id: litellm/v1alpha1/key
  labels:
    testing.upbound.io/example-name: example
  name: example-key
spec:
  forProvider:
    keyAlias: crossplane-example-key
    maxBudget: 10
    models:
      - gpt-4o-mini-proxy
    teamIdRef:
      name: example-team
    budgetIdRef:
      name: example-budget
    userIdRef:
      name: example-user
  # The issued token is sensitive and only returned on creation, so publish it
  # to a Secret for consumers.
  writeConnectionSecretToRef:
    name: example-key-connection
    namespace: crossplane-system
