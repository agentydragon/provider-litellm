apiVersion: litellm.crossplane.io/v1alpha1
kind: JWTKeyMapping
metadata:
  annotations:
    meta.upbound.io/example-id: litellm/v1alpha1/jwtkeymapping
  labels:
    testing.upbound.io/example-name: example
  name: example-jwt-key-mapping
spec:
  forProvider:
    jwtClaimName: team_id
    description: Maps a JWT claim to an existing LiteLLM virtual key
    isActive: true
    # The claim value is sensitive, so it is read from a Secret.
    jwtClaimValueSecretRef:
      name: jwt-claim-value
      key: value
      namespace: crossplane-system
    # Creating a mapping needs the token of an existing key, supplied through
    # the write-only key_wo argument. A Key publishes its token to the Secret
    # named by writeConnectionSecretToRef.
    keyWoSecretRef:
      name: example-key-connection
      key: attribute.key
      namespace: crossplane-system
    keyWoVersion: "1"
